<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Core Orb Gradient -->
    <linearGradient id="orbGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cosmicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Notification Glow -->
    <filter id="alertGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern App Icon Base: Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Subtle Outer Aura Glow -->
  <circle cx="64" cy="64" r="34" fill="#8B5CF6" opacity="0.3" filter="url(#cosmicGlow)"/>

  <!-- Back of Orbital Ring (Behind Planet) -->
  <path d="M 22 75 A 48 16 332 0 1 106 53" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Celestial Planet Orb -->
  <circle cx="64" cy="64" r="27" fill="url(#orbGrad)"/>
  
  <!-- Planet Core Highlight / Reflection -->
  <ellipse cx="55" cy="53" rx="13" ry="7" fill="#FFFFFF" opacity="0.38" transform="rotate(-28 55 53)"/>

  <!-- Front of Orbital Ring (In front of Planet) -->
  <path d="M 106 53 A 48 16 332 0 1 22 75" fill="none" stroke="url(#ringGrad)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Glowing Alert Badge on Top-Right Corner -->
  <circle cx="98" cy="24" r="18" fill="#F43F5E" opacity="0.45" filter="url(#alertGlow)"/>
  <circle cx="98" cy="24" r="13" fill="#F43F5E" stroke="#0B0F19" stroke-width="2"/>
  <circle cx="98" cy="24" r="5" fill="#FFFFFF"/>

  <!-- Subtle Little Stars -->
  <circle cx="28" cy="94" r="2.5" fill="#A855F7"/>
  <circle cx="34" cy="32" r="1.5" fill="#38BDF8"/>
</svg>